# Python（FastAPI・スクリプト）向けのローカルルール。目的と限界は docs/semgrep.md を参照する。
# ルールを足す・変えるときは、security/semgrep/fixtures/python に、検出する例（ruleid）と
# 検出しない例（ok）を足す。足さないルールは `bash scripts/semgrep.sh fixtures` が失敗する。
rules:
  - id: py-sql-dynamic-string
    languages: [python]
    severity: ERROR
    message: >-
      SQL文を、f文字列・%・format・文字列の連結で組み立てて実行している。値は、プレースホルダ
      （%s など）と、別に渡す引数で渡す。テーブル名などの識別子は、固定の許可リストで選ぶか、
      psycopg の sql.Identifier を使う。
    # taintモードは、値を渡す第2引数の汚染まで検出して、正しい形（プレースホルダ）が誤検出になるため使わない。
    # 検出するのは、SQL文（第1引数）が、組み立てた文字列そのもの、または、同じ関数内で
    # `変数 = 組み立てた文字列` と代入した変数の場合。関数をまたぐ流れ・再代入・辞書や属性は追わない。
    pattern-either:
      # 1. SQL文が、組み立てた文字列そのもの
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$M($S, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(execute|executemany|exec_driver_sql)$
              - pattern: text($S, ...)
          - metavariable-pattern:
              metavariable: $S
              patterns:
                - pattern-either:
                    - pattern: f"...{...}..."
                    - pattern: '"...".format(...)'
                    - pattern: '"..." % $X'
                    - pattern: '"..." + $X'
                    - pattern: '$X + "..."'
          # 固定の文字列どうしの連結（"a" + "b"）は、値を含まない。
          - pattern-not: $C.$M("..." + "...", ...)
      # 2. SQL文が、同じ関数内で、組み立てた文字列を代入した変数
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $C.$M($S, ...)
                  - metavariable-regex:
                      metavariable: $M
                      regex: ^(execute|executemany|exec_driver_sql)$
              - pattern: text($S, ...)
          - pattern-inside: |
              $S = $SRC
              ...
          - metavariable-pattern:
              metavariable: $SRC
              patterns:
                - pattern-either:
                    - pattern: f"...{...}..."
                    - pattern: '"...".format(...)'
                    - pattern: '"..." % $X'
                    - pattern: '"..." + $X'
                    - pattern: '$X + "..."'
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"

  - id: py-shell-command-injection
    languages: [python]
    severity: ERROR
    message: >-
      シェルを通してコマンドを実行している（shell=True、os.system、os.popen）。引数が変わる場合は、
      引数のリストで渡し、shell=True を使わない。固定の文字列だけのときは、検出しない。
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - metavariable-regex:
          metavariable: $CMD
          regex: '^(?!\s*("[^"\\]*"|''[^''\\]*'')\s*$)'
      - focus-metavariable: $CMD
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"

  - id: py-eval-exec-dynamic
    languages: [python]
    severity: ERROR
    message: >-
      eval・exec を、固定の文字列以外に対して呼んでいる。入力を解釈する処理は、ast.literal_eval
      や、決まった形式（JSONなど）の読み取りに置き換える。
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - metavariable-regex:
          metavariable: $X
          regex: '^(?!\s*("[^"\\]*"|''[^''\\]*'')\s*$)'
      - focus-metavariable: $X
    metadata:
      category: security
      cwe: "CWE-95: Eval Injection"

  - id: py-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      信頼できないデータから、任意のコードが実行されうる形式（pickle・marshal・yaml.load の既定の
      Loader）を読み込んでいる。JSON か、yaml.safe_load を使う。
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.load($X, yaml.SafeLoader)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
