# E2E専用の上書き設定。scripts/e2e.sh が compose.yaml と重ねて、専用のプロジェクト名で使う。
# 通常の開発環境（ポート5173・8000）と同時に動かせるよう、ホストへのポート公開は外す。
services:
  frontend:
    ports: !reset []
  backend:
    ports: !reset []
  e2e:
    build: ./e2e
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      CI: "${CI:-}"
      SHOTS: "${SHOTS:-}"
      E2E_EXPECTED_HEALTH_STATUS: "${E2E_EXPECTED_HEALTH_STATUS:-ok}"
    volumes:
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/playwright-report:/e2e/playwright-report
