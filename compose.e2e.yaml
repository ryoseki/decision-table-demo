# E2E専用の上書き設定。scripts/e2e.sh が compose.yaml と重ねて、専用のプロジェクト名で使う。
# 通常の開発環境（ポート5173・8000）と同時に動かせるよう、ホストへのポート公開は外す。
services:
  frontend:
    ports: !reset []
  backend:
    ports: !reset []
  e2e-shared-backend:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: "${DB_NAME:-decision_demo}"
      DB_USER: "${DB_USER:-demo_admin}"
      DB_PASSWORD: ""
      SHARED_CONFIG_DB: "1"
      PROPOSAL_REUSE_ENABLED: "1"
      PYTHONPATH: /app:/fixtures
    volumes:
      - ./e2e/fixtures:/fixtures:ro
    command: ["uvicorn", "shared_demo:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  # E2E専用のシード（e2e/fixtures/seed_retirement_case.py）。この専用プロジェクトのDBにだけ、
  # 参照のない架空の設問A13と、A13に保存済みの回答を持つ判定未登録の案件を入れる。通常の開発環境には入れない。
  e2e-fixture:
    build: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: "${DB_NAME:-decision_demo}"
      DB_USER: "${DB_USER:-demo_admin}"
      DB_PASSWORD: ""
      PYTHONPATH: /app
    volumes:
      - ./e2e/fixtures:/fixtures:ro
    command: ["python", "/fixtures/seed_retirement_case.py"]
    restart: "no"
  # 共有サンプル案件のE2E用に、案件が1件もない専用スキーマ（同じE2E専用DBの中）と、それを使うバックエンド。
  # 画面からの /api は、テスト側で、このバックエンドへ向ける（shared-demo と同じ方法）。
  e2e-empty-db-init:
    build: ./db
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: "${DB_NAME:-decision_demo}"
      DB_USER: "${DB_USER:-demo_admin}"
      DB_PASSWORD: ""
      DB_SCHEMA: e2e_empty
      PYTHONPATH: /db:/fixtures
      DOCS_DIR: /repo/docs
    volumes:
      - ./docs:/repo/docs:ro
      - ./e2e/fixtures:/fixtures:ro
    command: ["python", "/fixtures/init_empty_schema.py"]
    restart: "no"
  e2e-empty-backend:
    build: ./backend
    depends_on:
      e2e-empty-db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: "${DB_NAME:-decision_demo}"
      DB_USER: "${DB_USER:-demo_admin}"
      DB_PASSWORD: ""
      DB_SCHEMA: e2e_empty
      MOCK_BASE_URL: "http://127.0.0.1:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  e2e:
    build: ./e2e
    depends_on:
      e2e-empty-backend:
        condition: service_healthy
      e2e-shared-backend:
        condition: service_healthy
      e2e-fixture:
        condition: service_completed_successfully
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      CI: "${CI:-}"
      SHOTS: "${SHOTS:-}"
      E2E_EXPECTED_HEALTH_STATUS: "${E2E_EXPECTED_HEALTH_STATUS:-ok}"
    volumes:
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/playwright-report:/e2e/playwright-report
